services:
  instructor-revenue-ledger:
    build:
      context: .
      dockerfile: Dockerfile
    image: instructor-revenue-ledger:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/public_html
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: instructor_revenue_ledger
      MYSQL_USER: instructor_user
      MYSQL_PASSWORD: secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql

  phpmyadmin:
    container_name: phpmyadmin-container
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  mysql:
